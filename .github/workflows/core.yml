name: Native core source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Select approved Apple toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -d /Applications/Xcode_26.1.1.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.1.1.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Provision pinned Linux v26 SDK
        if: runner.os == 'Linux'
        shell: bash
        run: |
          url="$(jq -er '.unreal["linux-x64"].archive.url' config/toolchains.json)"
          digest="$(jq -er '.unreal["linux-x64"].archive.sha256' config/toolchains.json)"
          root="$(jq -er '.unreal["linux-x64"].archive.root' config/toolchains.json)"
          archive="$RUNNER_TEMP/native-linux-v26.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$url"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" "$root/x86_64-unknown-linux-gnu"
          sdk="$RUNNER_TEMP/$root/x86_64-unknown-linux-gnu"
          {
            echo "CANOPY_LINUX_TOOLCHAIN_ROOT=$sdk"
            echo "CANOPY_LINUX_SYSROOT=$sdk"
            echo "CANOPY_LINUX_LIBCXX_INCLUDE=$sdk/include/c++/v1"
            echo "CANOPY_LINUX_LIBCXX_LIBDIR=$sdk/lib64"
          } >> "$GITHUB_ENV"
      - name: Resolve frozen source environment
        if: runner.os != 'Windows'
        run: uv sync --frozen --all-packages --all-extras
      - name: Capture host source-build evidence
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uname -a
          uv run --frozen python --version
          uv run --frozen cmake --version
          uv run --frozen ninja --version
      - name: Verify selected compiler against approved SDK profile
        if: runner.os != 'Windows'
        run: uv run --frozen python -c "from pathlib import Path; from scripts import build_common as c, build_game as g; host = g.native_platform(); print(g.qualified_compiler(Path.cwd(), host, c.load_json(Path('config/toolchains.json'))['unreal'][host]))"
      - name: Initialize MSVC and check native core on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Visual Studio installer vswhere.exe is missing' }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'MSVC developer environment is unavailable' }
          Write-Output 'Installed MSVC compiler toolsets:'
          Get-ChildItem -LiteralPath (Join-Path $vs 'VC\Tools\MSVC') -Directory | ForEach-Object { $_.Name }
          if (-not (Get-ChildItem -LiteralPath (Join-Path $vs 'VC\Tools\MSVC') -Directory -Filter '14.50.*')) {
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            $channel = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property channelId
            if ($LASTEXITCODE -ne 0 -or -not $channel) { throw 'Installed Visual Studio channel is unavailable' }
            $arguments = 'modify --installPath "' + $vs + '" --channelId "' + $channel + '" --add Microsoft.VisualStudio.Component.VC.14.50.18.0.x86.x64 --quiet --norestart --noUpdateInstaller'
            $install = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "MSVC 14.50 component installation failed: $($install.ExitCode)" }
          }
          $vsdev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $vsdev)) { throw 'VsDevCmd.bat is missing' }
          $check = 'uv run --frozen python -c "from pathlib import Path; from scripts import build_common as c, build_game as g; print(g.qualified_compiler(Path.cwd(), ''win64'', c.load_json(Path(''config/toolchains.json''))[''unreal''][''win64'']))"'
          $commands = 'call "' + $vsdev + '" -arch=amd64 -host_arch=amd64 -vcvars_ver=14.50 -winsdk=10.0.26100.0 && uv sync --frozen --all-packages --all-extras && ' + $check + ' && uv run --frozen python scripts/bootstrap_native.py && uv run --frozen python scripts/build_core.py --config Debug && uv run --frozen ctest --test-dir .build/core --output-on-failure && uv run --frozen python -m pytest tests/build -q'
          & cmd.exe /d /c $commands
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap pinned native dependencies
        if: runner.os != 'Windows'
        run: uv run --frozen python scripts/bootstrap_native.py
      - name: Build standalone core (not Unreal qualified)
        if: runner.os != 'Windows'
        run: uv run --frozen python scripts/build_core.py --config Debug
      - name: Native core tests
        if: runner.os != 'Windows'
        run: uv run --frozen ctest --test-dir .build/core --output-on-failure
      - name: Build preflight behavior tests
        if: runner.os != 'Windows'
        run: uv run --frozen python -m pytest tests/build -q
      - name: Retain source build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-evidence-${{ matrix.os }}
          path: |
            .build/native-bootstrap.json
            .build/native-bootstrap-attempt.json
            .build/core/*/canopy-core-manifest.json
            .build/core/Testing/Temporary/LastTest.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
