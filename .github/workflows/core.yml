name: Native core source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Resolve frozen source environment
        if: runner.os != 'Windows'
        run: uv sync --frozen --all-packages --all-extras
      - name: Capture host source-build evidence
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uname -a
          uv run --frozen python --version
          uv run --frozen cmake --version
          uv run --frozen ninja --version
      - name: Initialize MSVC and check native core on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Visual Studio installer vswhere.exe is missing' }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'MSVC developer environment is unavailable' }
          $vsdev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $vsdev)) { throw 'VsDevCmd.bat is missing' }
          $commands = 'call "' + $vsdev + '" -arch=amd64 -host_arch=amd64 && uv sync --frozen --all-packages --all-extras && uv run --frozen python scripts/bootstrap_native.py && uv run --frozen python scripts/build_core.py --config Debug && uv run --frozen ctest --test-dir .build/core --output-on-failure && uv run --frozen python -m pytest tests/build -q'
          & cmd.exe /d /c $commands
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap pinned native dependencies
        if: runner.os != 'Windows'
        run: uv run --frozen python scripts/bootstrap_native.py
      - name: Build standalone core (not Unreal qualified)
        if: runner.os != 'Windows'
        run: uv run --frozen python scripts/build_core.py --config Debug
      - name: Native core tests
        if: runner.os != 'Windows'
        run: uv run --frozen ctest --test-dir .build/core --output-on-failure
      - name: Build preflight behavior tests
        if: runner.os != 'Windows'
        run: uv run --frozen python -m pytest tests/build -q
      - name: Retain source build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-evidence-${{ matrix.os }}
          path: |
            .build/native-bootstrap.json
            .build/native-bootstrap-attempt.json
            .build/core/*/canopy-core-manifest.json
            .build/core/Testing/Temporary/LastTest.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
